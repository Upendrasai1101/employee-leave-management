<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Management</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #6a7385; --line: #e3e6ec;
    --brand: #3157d5; --brand-ink: #ffffff;
    --ok: #17803d; --ok-bg: #e3f5ea; --warn: #96620a; --warn-bg: #fdf0d5; --bad: #b3261e; --bad-bg: #fbe4e2;
    --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 16px rgba(20,30,50,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e8ebf2; --muted: #98a1b3; --line: #2b3240;
      --brand: #6f8cff; --brand-ink: #0d1220;
      --ok: #5fd08a; --ok-bg: #16301f; --warn: #f0be5a; --warn-bg: #34290f; --bad: #ff8a80; --bad-bg: #3a1c1a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 960px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .bar h1 { font-size: 17px; margin: 0; flex: 1; }
  .who { color: var(--muted); font-size: 13px; text-align: right; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 14px; font-size: 16px; }
  .auth { max-width: 400px; margin: 40px auto; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; font: inherit; }
  .tab.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  button.primary { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  button.link { background: none; border: 1px solid var(--line); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .balance { display: flex; align-items: baseline; gap: 8px; }
  .balance .n { font-size: 40px; font-weight: 700; line-height: 1; }
  .balance .u { color: var(--muted); }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .head h2 { margin: 0; flex: 1; }
  .live { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .PENDING { background: var(--warn-bg); color: var(--warn); }
  .APPROVED { background: var(--ok-bg); color: var(--ok); }
  .REJECTED { background: var(--bad-bg); color: var(--bad); }
  .acts { display: flex; gap: 6px; white-space: nowrap; }
  .acts button { padding: 5px 12px; border-radius: 7px; border: 0; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .acts .a { background: var(--ok-bg); color: var(--ok); }
  .acts .r { background: var(--bad-bg); color: var(--bad); }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; }
  .muted { color: var(--muted); }
  .scroll { overflow-x: auto; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90vw; padding: 10px 16px; border-radius: 10px; color: #fff; font-size: 14px; display: none; z-index: 5; }
  #toast.ok { background: #17803d; } #toast.err { background: #b3261e; }
  .hidden { display: none !important; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Leave Management</h1>
    <div class="who hidden" id="who"></div>
    <button class="link hidden" id="logout">Logout</button>
  </div>
</header>

<main>
  <!-- LOGIN / REGISTER -->
  <section class="card auth" id="authView">
    <div class="tabs">
      <button class="tab on" data-tab="login">Login</button>
      <button class="tab" data-tab="register">Register</button>
    </div>

    <form id="loginForm">
      <label for="lEmail">Email</label>
      <input id="lEmail" type="email" autocomplete="username" required>
      <label for="lPass">Password</label>
      <input id="lPass" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Login</button>
      <p class="hint">Default manager: manager@company.com / Manager@123</p>
    </form>

    <form id="registerForm" class="hidden">
      <label for="rName">Name</label>
      <input id="rName" required maxlength="100">
      <label for="rEmail">Email</label>
      <input id="rEmail" type="email" required>
      <label for="rPass">Password (min 8 characters)</label>
      <input id="rPass" type="password" minlength="8" maxlength="72" required autocomplete="new-password">
      <div class="row">
        <div><label for="rDept">Department</label><input id="rDept" maxlength="100"></div>
        <div><label for="rMgr">Manager ID</label><input id="rMgr" type="number" min="1" value="1"></div>
      </div>
      <button class="primary" type="submit">Create account</button>
      <p class="hint">New accounts are always employees. Manager ID 1 is the default manager.</p>
    </form>
  </section>

  <!-- EMPLOYEE -->
  <div id="employeeView" class="hidden">
    <section class="card">
      <h2>Leave balance</h2>
      <div class="balance"><span class="n" id="balance">–</span><span class="u">days remaining</span></div>
    </section>

    <section class="card">
      <h2>Apply for leave</h2>
      <form id="applyForm">
        <div class="row">
          <div>
            <label for="aType">Type</label>
            <select id="aType"><option>CASUAL</option><option>SICK</option><option>EARNED</option></select>
          </div>
          <div></div>
          <div><label for="aStart">Start date</label><input id="aStart" type="date" required></div>
          <div><label for="aEnd">End date</label><input id="aEnd" type="date" required></div>
        </div>
        <label for="aReason">Reason</label>
        <textarea id="aReason" rows="2" maxlength="500" required></textarea>
        <div class="hint" id="daysHint">&nbsp;</div>
        <button class="primary" type="submit">Submit request</button>
      </form>
    </section>

    <section class="card">
      <div class="head"><h2>My leave history</h2><span class="live" id="empLive"></span><button class="link" id="empRefresh">Refresh</button></div>
      <div class="scroll" id="history"></div>
    </section>
  </div>

  <!-- MANAGER -->
  <div id="managerView" class="hidden">
    <section class="card">
      <div class="head">
        <h2>Team leave requests</h2>
        <span class="live" id="mgrLive"></span>
        <select id="filter" style="width:auto">
          <option value="ALL">All</option><option value="PENDING" selected>Pending</option>
          <option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option>
        </select>
        <button class="link" id="mgrRefresh">Refresh</button>
      </div>
      <div class="scroll" id="team"></div>
    </section>
  </div>
</main>

<div id="toast"></div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const POLL_MS = 10000;
  let session = null;          // { token, role, email, employeeId }
  let pollTimer = null;
  let teamData = [];

  try { session = JSON.parse(sessionStorage.getItem('lm-session')); } catch (e) { session = null; }

  // ---------- helpers ----------
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function toast(msg, ok) {
    const t = $('toast');
    t.textContent = msg; t.className = ok ? 'ok' : 'err'; t.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = 'none'; }, 4500);
  }
  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (session && session.token) headers.Authorization = 'Bearer ' + session.token;
    let res;
    try { res = await fetch(path, { ...opts, headers }); }
    catch (e) { throw new Error('Cannot reach the server. Is the app running?'); }
    let data = null;
    try { data = await res.json(); } catch (e) { /* empty body */ }
    if (!res.ok) {
      if (res.status === 401 && session) { logout(); throw new Error('Session expired, please login again'); }
      let msg = (data && data.message) || ('Request failed (' + res.status + ')');
      if (data && data.validationErrors) msg += ': ' + Object.values(data.validationErrors).join(', ');
      throw new Error(msg);
    }
    return data;
  }
  const iso = d => d.toISOString().slice(0, 10);
  const badge = s => '<span class="badge ' + esc(s) + '">' + esc(s) + '</span>';
  const dates = l => esc(l.startDate) + (l.endDate !== l.startDate ? ' → ' + esc(l.endDate) : '');
  function stamp(el) { el.textContent = 'Updated ' + new Date().toLocaleTimeString(); }

  // ---------- views ----------
  function show(view) {
    ['authView', 'employeeView', 'managerView'].forEach(v => $(v).classList.toggle('hidden', v !== view));
    const inApp = view !== 'authView';
    $('who').classList.toggle('hidden', !inApp);
    $('logout').classList.toggle('hidden', !inApp);
    if (inApp) $('who').textContent = session.email + ' (' + session.role + ')';
  }
  function enter() {
    clearInterval(pollTimer);
    if (!session) { show('authView'); return; }
    if (session.role === 'MANAGER') {
      show('managerView'); loadTeam();
      pollTimer = setInterval(loadTeam, POLL_MS);
    } else {
      show('employeeView');
      const today = iso(new Date());
      $('aStart').min = today; $('aEnd').min = today;
      loadEmployee();
      pollTimer = setInterval(loadEmployee, POLL_MS);
    }
  }
  function logout() {
    session = null; sessionStorage.removeItem('lm-session'); clearInterval(pollTimer); show('authView');
  }

  // ---------- auth ----------
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
    $('loginForm').classList.toggle('hidden', b.dataset.tab !== 'login');
    $('registerForm').classList.toggle('hidden', b.dataset.tab !== 'register');
  }));

  async function doLogin(email, password, btn) {
    btn.disabled = true;
    try {
      const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      session = { token: r.token, role: r.role, email: r.email, employeeId: r.employeeId };
      sessionStorage.setItem('lm-session', JSON.stringify(session));
      enter();
    } catch (e) { toast(e.message); }
    finally { btn.disabled = false; }
  }
  $('loginForm').addEventListener('submit', ev => {
    ev.preventDefault();
    doLogin($('lEmail').value.trim(), $('lPass').value, ev.submitter || ev.target.querySelector('button.primary'));
  });
  $('registerForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button.primary'); btn.disabled = true;
    const email = $('rEmail').value.trim(), password = $('rPass').value;
    const mgr = $('rMgr').value ? Number($('rMgr').value) : null;
    try {
      await api('/api/auth/register', { method: 'POST', body: JSON.stringify({
        name: $('rName').value.trim(), email, password, department: $('rDept').value.trim() || null, managerId: mgr }) });
      toast('Account created, logging you in...', true);
      await doLogin(email, password, btn);
    } catch (e) { toast(e.message); }
    finally { btn.disabled = false; }
  });
  $('logout').addEventListener('click', logout);

  // ---------- employee ----------
  async function loadEmployee() {
    try {
      const [bal, hist] = await Promise.all([api('/api/leaves/balance'), api('/api/leaves/my-history')]);
      $('balance').textContent = bal.remainingLeaveBalance;
      $('history').innerHTML = hist.length
        ? '<table><thead><tr><th>#</th><th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th>Manager comment</th></tr></thead><tbody>' +
          hist.map(l => '<tr><td>' + l.id + '</td><td>' + esc(l.leaveType) + '</td><td>' + dates(l) + '</td><td>' + l.numberOfDays +
            '</td><td>' + esc(l.reason) + '</td><td>' + badge(l.status) + '</td><td class="muted">' + esc(l.managerComment || '–') + '</td></tr>').join('') + '</tbody></table>'
        : '<div class="empty">No leave requests yet.</div>';
      stamp($('empLive'));
    } catch (e) { if (session) toast(e.message); }
  }
  $('empRefresh').addEventListener('click', loadEmployee);

  function updateDaysHint() {
    const s = $('aStart').value, e = $('aEnd').value;
    if (!s || !e) { $('daysHint').innerHTML = '&nbsp;'; return; }
    const n = Math.round((new Date(e) - new Date(s)) / 86400000) + 1;
    $('daysHint').textContent = n > 0 ? n + ' day(s) requested (counting both start and end date)' : 'End date must be on or after start date';
  }
  $('aStart').addEventListener('change', () => { if ($('aEnd').value < $('aStart').value) $('aEnd').value = $('aStart').value; $('aEnd').min = $('aStart').value; updateDaysHint(); });
  $('aEnd').addEventListener('change', updateDaysHint);

  $('applyForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button.primary'); btn.disabled = true;
    try {
      await api('/api/leaves', { method: 'POST', body: JSON.stringify({
        leaveType: $('aType').value, startDate: $('aStart').value, endDate: $('aEnd').value, reason: $('aReason').value.trim() }) });
      toast('Leave request submitted', true);
      ev.target.reset(); updateDaysHint(); loadEmployee();
    } catch (e) { toast(e.message); }
    finally { btn.disabled = false; }
  });

  // ---------- manager ----------
  function renderTeam() {
    const f = $('filter').value;
    const rows = teamData.filter(l => f === 'ALL' || l.status === f);
    $('team').innerHTML = rows.length
      ? '<table><thead><tr><th>#</th><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>' +
        rows.map(l => '<tr><td>' + l.id + '</td><td>' + esc(l.employeeName) + '</td><td>' + esc(l.leaveType) + '</td><td>' + dates(l) +
          '</td><td>' + l.numberOfDays + '</td><td>' + esc(l.reason) + '</td><td>' + badge(l.status) +
          (l.managerComment ? '<div class="hint">' + esc(l.managerComment) + '</div>' : '') + '</td><td>' +
          (l.status === 'PENDING'
            ? '<div class="acts"><button class="a" data-act="approve" data-id="' + l.id + '">Approve</button><button class="r" data-act="reject" data-id="' + l.id + '">Reject</button></div>'
            : '') + '</td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">' + (teamData.length ? 'Nothing in this filter.' : 'No leave requests from your team yet.') + '</div>';
  }
  async function loadTeam() {
    try { teamData = await api('/api/leaves/team'); renderTeam(); stamp($('mgrLive')); }
    catch (e) { if (session) toast(e.message); }
  }
  $('mgrRefresh').addEventListener('click', loadTeam);
  $('filter').addEventListener('change', renderTeam);
  $('team').addEventListener('click', async ev => {
    const b = ev.target.closest('button[data-act]'); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    let body;
    if (act === 'reject') {
      const c = prompt('Reason for rejecting (optional):');
      if (c === null) return;
      body = JSON.stringify({ comment: c.trim() || null });
    }
    b.disabled = true;
    try {
      await api('/api/leaves/' + id + '/' + act, { method: 'PUT', body });
      toast('Request #' + id + (act === 'approve' ? ' approved' : ' rejected'), true);
      loadTeam();
    } catch (e) { toast(e.message); b.disabled = false; }
  });

  enter();
})();
</script>
</body>
</html>
